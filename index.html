 <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Siyam Dashboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .hidden { display: none; }
        .dashboard-btn { padding: 15px 30px; margin: 10px; cursor: pointer; display: block; width: 200px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <!-- লগইন সেকশন -->
    <div id="login-section">
        <h2>লগইন করুন</h2>
        <input type="email" id="email" placeholder="ইমেইল দিন"><br><br>
        <input type="password" id="password" placeholder="পাসওয়ার্ড দিন"><br><br>
        <button onclick="checkLogin()">Login</button>
    </div>

    <!-- ড্যাশবোর্ড সেকশন -->
    <div id="dashboard" class="hidden">
        <h1>স্বাগতম, Siyam!</h1>
        <button class="dashboard-btn" onclick="showSection('home')">Home</button>
        <button class="dashboard-btn" onclick="showSection('exam')">Exam</button>
        <button class="dashboard-btn" onclick="showSection('profile')">Profile</button>
        <button class="dashboard-btn" onclick="showSection('leaderboard')">Leaderboard</button>
        <button class="dashboard-btn" onclick="location.reload()" style="background: red; color: white;">Logout</button>
    </div>

    <div id="content-area"></div>

    <script>
        function checkLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (email === "siyam19065@gmail.com" && pass === "Siyam123@#") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                alert("ভুল ইমেইল বা পাসওয়ার্ড!");
            }
        }

        function showSection(section) {
            const area = document.getElementById('content-area');
            area.innerHTML = `<h2>আপনি এখন ${section.toUpperCase()} সেকশনে আছেন</h2>`;
        }
    </script>
</body>
</html>
