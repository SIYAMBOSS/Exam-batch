<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনলাইন এক্সাম প্ল্যাটফর্ম</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h2>অনলাইন মডেল টেস্ট</h2>
        <div id="quiz">
            <div class="question" id="question">প্রশ্ন এখানে লোড হবে...</div>
            <div class="options" id="options">
                <!-- অপশনগুলো এখানে জাভাস্ক্রিপ্ট দ্বারা যুক্ত হবে -->
            </div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
        <div id="result" class="result"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
